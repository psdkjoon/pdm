name: release

on:
  push:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Compile pdm
        run: dart compile exe bin/pdm.dart -o pdm-linux-bin

      - name: Compile pdmd
        run: dart compile exe bin/pdmd.dart -o pdmd-linux-bin

      - name: Build self-contained installer
        run: |
          dart run tool/installer.dart generate pdm-linux-bin pdmd-linux-bin tool/installer.dart
          dart compile exe tool/installer.dart -o pdm-linux-x64
          git checkout -- tool/installer.dart

      - uses: actions/upload-artifact@v4
        with:
          name: pdm-linux-x64
          path: pdm-linux-x64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Compile pdm
        run: dart compile exe bin/pdm.dart -o pdm-windows-bin.exe

      - name: Compile pdmd
        run: dart compile exe bin/pdmd.dart -o pdmd-windows-bin.exe

      - name: Build self-contained installer
        run: |
          dart run tool/installer.dart generate pdm-windows-bin.exe pdmd-windows-bin.exe tool/installer.dart
          dart compile exe tool/installer.dart -o pdm-windows-x64.exe
          git checkout -- tool/installer.dart

      - uses: actions/upload-artifact@v4
        with:
          name: pdm-windows-x64
          path: pdm-windows-x64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          cp dist/pdm-linux-x64/pdm-linux-x64 release/pdm-linux-x64
          cp dist/pdm-windows-x64/pdm-windows-x64.exe release/pdm-windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            release/pdm-linux-x64
            release/pdm-windows-x64.exe
